name: Checks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: mkroening/rust-toolchain-toml@efdebac439b4b9a6c5de2df55452c21faa37420f # main

      - name: Add wasm target
        run: rustup target add wasm32-unknown-emscripten

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Setup vcpkg
        uses: ./.github/actions/vcpkg-setup

      - name: Run clippy (desktop)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run clippy (wasm)
        run: cargo clippy -p pacman --target wasm32-unknown-emscripten --all-targets --all-features -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

      - uses: taiki-e/install-action@1cacf5c5198b25f60b90968ce45860e926d584b0 # cargo-audit

      - name: Run security audit
        run: cargo audit
