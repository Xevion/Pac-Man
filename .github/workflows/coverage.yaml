name: Code Coverage

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Setup vcpkg
        uses: ./.github/actions/vcpkg-setup

      - uses: taiki-e/install-action@91534edaf9fd796a162759d80d49cdff574bff2c # cargo-llvm-cov
      - uses: taiki-e/install-action@11c82bec3ad7f6041db8bd552d47469a973381cd # nextest
      - uses: taiki-e/install-action@bafb217ce243dd135aa0204d91238f387d005863 # just

      - name: Generate coverage report
        run: |
          just coverage
        working-directory: pacman

      - name: Check Coveralls Token
        run: |
          if [ -z "${{ secrets.COVERALLS_REPO_TOKEN }}" ]; then
            echo "::warning::COVERALLS_REPO_TOKEN not available - coverage upload skipped (common for Dependabot PRs)"
          else
            echo "COVERALLS_REPO_TOKEN is available - will upload coverage"
          fi

      - name: Coveralls upload
        if: ${{ env.COVERALLS_REPO_TOKEN != '' }}
        continue-on-error: true
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          github-token: ${{ env.COVERALLS_REPO_TOKEN }}
          path-to-lcov: lcov.info
          debug: true
