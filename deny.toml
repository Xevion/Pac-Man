[advisories]
unmaintained = "workspace"

# jsonwebtoken's rust_crypto backend links rsa and the p256/p384 curves for algorithms the
# server never uses: it signs HS256 and validates with Validation::new(HS256) only.
ignore = [
    # rsa: private-key decryption timing (Marvin). No RSA key is ever held.
    "RUSTSEC-2023-0071",
    # crypto-bigint 0.5 (via rsa and ecdsa): non-constant-time operations in RS*/ES* paths.
    "RUSTSEC-2026-0387",
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Workspace crates are GPL-3.0-or-later and never published.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
