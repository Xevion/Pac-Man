[package]
name = "pacman-server"
version = "0.4.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A leaderboard API for the Pac-Man game"
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
default-run = "pacman-server"

[lib]
name = "pacman_server"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "chrono",
] }
chrono = { version = "0.4", features = ["serde", "clock"] }
figment = { version = "0.10", features = ["env"] }
dotenvy = "0.15"
axum-cookie = "0.3"
async-trait = "0.1"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
tower-http = { version = "0.7", features = ["trace", "fs", "normalize-path"] }
time = { workspace = true, features = ["macros", "formatting"] }
yansi = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
sha2 = "0.11"
mockall = "0.15"
testcontainers = { version = "0.28", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "http2", "charset", "rustls-tls-webpki-roots-no-provider"] }
rusty-s3 = "0.11"
# validator = { version = "0.16", features = ["derive"] }

[features]
default = []
postgres-tests = ["dep:testcontainers"]

[dev-dependencies]
assert2.workspace = true
rstest.workspace = true
anyhow = "1"
axum-test = "21"
bon = "3.7.2"
cookie = "0.18.1"

[lints]
workspace = true
